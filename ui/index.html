<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050507">
  <meta name="wistv-relay-api" content="/api/relay">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WiS TV">
  <title>WiS TV</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="backdrop" aria-hidden="true">
    <div class="bd-layer" id="bd-a"></div>
    <div class="bd-layer" id="bd-b"></div>
    <div class="bd-shade"></div>
  </div>

  <header id="topbar" hidden>
    <div class="top-left">
      <button class="icon-btn back-btn focusable" id="back-btn" aria-label="Quay lại" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <a class="brand focusable" data-route="home" tabindex="0"><span class="brand-w">WiS</span><span class="brand-tv">TV</span></a>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab focusable" data-route="home">Trang chủ</button>
      <button class="tab focusable" data-route="discover">Khám phá</button>
      <button class="tab focusable" data-route="movie">Phim</button>
      <button class="tab focusable" data-route="series">Phim bộ</button>
      <button class="tab focusable" data-route="calendar">Lịch</button>
      <button class="tab focusable" data-route="library">Thư viện</button>
      <button class="tab focusable" data-route="addons">Addon</button>
    </nav>
    <div class="top-right">
      <button class="icon-btn focusable" data-route="search" aria-label="Tìm kiếm">
        <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn focusable" data-route="settings" id="settings-btn" aria-label="Cài đặt">
        <svg viewBox="0 0 24 24" width="21" height="21"><path d="M9.72 4.64 9.97 2.4h4.06l.25 2.24 1.31.55 1.76-1.41 2.87 2.87-1.41 1.76.55 1.31 2.24.25v4.06l-2.24.25-.55 1.31 1.41 1.76-2.87 2.87-1.76-1.41-1.31.55-.25 2.24H9.97l-.25-2.24-1.31-.55-1.76 1.41-2.87-2.87 1.41-1.76-.55-1.31-2.24-.25V9.97l2.24-.25.55-1.31-1.41-1.76 2.87-2.87 1.76 1.41Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
      <button class="avatar focusable" data-route="settings" id="avatar" aria-label="Tài khoản">W</button>
    </div>
    <div class="chips" id="chips">
      <button class="chip focusable" data-route="movie">Phim</button>
      <button class="chip focusable" data-route="series">Phim bộ</button>
      <button class="chip focusable" id="discover-chip" aria-haspopup="menu" aria-expanded="false">Khám phá<svg viewBox="0 0 24 24" width="16" height="16"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </header>

  <nav id="dock" aria-label="Điều hướng" hidden>
    <button class="dock-btn focusable" data-route="home"><svg viewBox="0 0 24 24"><path d="M4 10.4 12 4l8 6.4V19a1.5 1.5 0 0 1-1.5 1.5H15v-5.2a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5.2H5.5A1.5 1.5 0 0 1 4 19v-8.6Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>Trang chủ</span></button>
    <button class="dock-btn focusable" data-route="together"><svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 19.5c.6-3.3 3-5.2 6-5.2s5.4 1.9 6 5.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M15.5 5.6a3.1 3.1 0 0 1 0 5.9M17.6 14.6c1.8.6 3 2.2 3.4 4.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Xem chung</span></button>
    <button class="dock-btn focusable" data-route="calendar"><svg viewBox="0 0 24 24"><rect x="3.8" y="5.2" width="16.4" height="15" rx="2.6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.8 10h16.4M8.2 3.2v4M15.8 3.2v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="8.6" cy="14.4" r="1.2" fill="currentColor"/><circle cx="12" cy="14.4" r="1.2" fill="currentColor"/></svg><span>Lịch</span></button>
    <button class="dock-btn focusable" data-route="library"><svg viewBox="0 0 24 24"><path d="M6.5 3.8h11a1.2 1.2 0 0 1 1.2 1.2v15.2l-6.7-4.3-6.7 4.3V5a1.2 1.2 0 0 1 1.2-1.2Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>Thư viện</span></button>
    <button class="dock-btn focusable" data-route="settings"><svg viewBox="0 0 24 24"><path d="M9.72 4.64 9.97 2.4h4.06l.25 2.24 1.31.55 1.76-1.41 2.87 2.87-1.41 1.76.55 1.31 2.24.25v4.06l-2.24.25-.55 1.31 1.41 1.76-2.87 2.87-1.76-1.41-1.31.55-.25 2.24H9.97l-.25-2.24-1.31-.55-1.76 1.41-2.87-2.87 1.41-1.76-.55-1.31-2.24-.25V9.97l2.24-.25.55-1.31-1.41-1.76 2.87-2.87 1.76 1.41Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>Cài đặt</span></button>
  </nav>

  <main id="view"></main>

  <div id="scrim" class="scrim" hidden></div>
  <aside id="sheet" class="sheet" hidden></aside>
  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
