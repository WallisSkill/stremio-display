<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050507">
  <meta name="wistv-relay-api" content="/api/relay">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WiS TV">
  <title>WiS TV</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="backdrop" aria-hidden="true">
    <div class="bd-layer" id="bd-a"></div>
    <div class="bd-layer" id="bd-b"></div>
    <div class="bd-shade"></div>
  </div>

  <header id="topbar" hidden>
    <div class="top-left">
      <button class="icon-btn back-btn focusable" id="back-btn" aria-label="Quay lại" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <a class="brand focusable" data-route="home" tabindex="0"><span class="brand-w">WiS</span><span class="brand-tv">TV</span></a>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab focusable" data-route="home">Trang chủ</button>
      <button class="tab focusable" data-route="movie">Phim</button>
      <button class="tab focusable" data-route="series">Phim bộ</button>
      <button class="tab focusable" data-route="calendar">Lịch</button>
      <button class="tab focusable" data-route="library">Thư viện</button>
      <button class="tab focusable" data-route="addons">Addon</button>
    </nav>
    <div class="top-right">
      <button class="icon-btn focusable" data-route="search" aria-label="Tìm kiếm">
        <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <button class="avatar focusable" data-route="settings" id="avatar" aria-label="Tài khoản">W</button>
    </div>
  </header>

  <main id="view"></main>

  <div id="scrim" class="scrim" hidden></div>
  <aside id="sheet" class="sheet" hidden></aside>
  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
