[package]
name = "wistv-relay"
version = "0.1.0"
edition = "2021"
description = "Lets the WiS TV web app reach the Stremio streaming server on this PC through a Cloudflare tunnel"

[dependencies]
bytes = "1"
futures-util = "0.3"
getrandom = "0.2"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time", "sync"] }

[profile.release]
codegen-units = 4
lto = "thin"
strip = true
