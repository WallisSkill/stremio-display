name: iOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "plugins/**"
      - "ui/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: write

concurrency:
  group: ios
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2

      - name: Install tools
        run: |
          for f in xcodegen libimobiledevice; do brew list "$f" >/dev/null 2>&1 || brew install "$f"; done
          pod --version || brew install cocoapods
          file "$(command -v cargo-tauri)"
          cargo tauri --version

      - name: Create Xcode project
        working-directory: src-tauri
        run: |
          cargo tauri ios init --ci
          cargo tauri icon icons/icon.png

      - name: Add mpv and app settings
        working-directory: src-tauri/gen/apple
        run: |
          ruby -ryaml -e '
            f = "project.yml"
            y = YAML.load_file(f)
            y["packages"] ||= {}
            y["packages"]["MPVKit"] = { "url" => "https://github.com/mpvkit/MPVKit", "exactVersion" => "1.0.0" }
            t = y["targets"].keys.find { |k| k.end_with?("_iOS") }
            target = y["targets"][t]
            (target["dependencies"] ||= []) << { "package" => "MPVKit", "product" => "MPVKit", "embed" => false }
            info = (target["info"] ||= {})
            info["path"] ||= Dir["*_iOS/Info.plist"].first
            props = (info["properties"] ||= {})
            props["CFBundleDisplayName"] = "WiS TV"
            props["UIBackgroundModes"] = ["audio"]
            props["NSAppTransportSecurity"] = { "NSAllowsArbitraryLoads" => true }
            props["UISupportedInterfaceOrientations"] = ["UIInterfaceOrientationPortrait", "UIInterfaceOrientationLandscapeLeft", "UIInterfaceOrientationLandscapeRight"]
            props["UIRequiresFullScreen"] = true
            File.write(f, y.to_yaml)
            puts y["targets"][t].to_yaml
          '
          xcodegen generate
          grep -q MPVKit *.xcodeproj/project.pbxproj

      - name: Download mpv packages
        working-directory: src-tauri/gen/apple
        run: |
          curl -sSIL -o /dev/null -w "github download check: %{http_code} " https://github.com/mpvkit/MPVKit/releases/download/1.0.0/Libmpv.xcframework.zip
          proj=$(ls -d *.xcodeproj | head -1)
          scheme="${proj%.xcodeproj}_iOS"
          for i in 1 2 3 4 5; do
            if xcodebuild -resolvePackageDependencies -project "$proj" -scheme "$scheme"; then exit 0; fi
            echo "retry $i"; sleep 20
          done
          exit 1

      - name: Build IPA
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo tauri ios build --no-sign -v 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Show build errors
        if: failure()
        run: |
          grep -nE "error:|error\[|Undefined symbol|ld: |fatal|BUILD FAILED|ARCHIVE FAILED|The following build commands failed" "$RUNNER_TEMP/build.log" | grep -v "^\s*$" | head -120 || true
          grep -nE -A3 "The following build commands failed" "$RUNNER_TEMP/build.log" || true

      - name: Collect IPA
        run: |
          mkdir -p out
          ipa=$(find src-tauri/gen/apple/build -name '*.ipa' | head -1)
          if [ -z "$ipa" ]; then
            app=$(find src-tauri/gen/apple/build -name '*.app' -type d | grep -i iphoneos | head -1)
            [ -n "$app" ] || app=$(find src-tauri/gen/apple/build -name '*.app' -type d | head -1)
            mkdir -p Payload && cp -R "$app" Payload/
          else
            unzip -q "$ipa"
          fi
          app=$(ls -d Payload/*.app | head -1)
          exe="$app/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          if [ -d "$app/Frameworks" ]; then
            for fw in "$app"/Frameworks/*.framework; do
              name=$(basename "$fw" .framework)
              if ! otool -L "$exe" | grep -q "$name.framework"; then
                echo "removing unused $name.framework"; rm -rf "$fw"
              fi
            done
            rmdir "$app/Frameworks" 2>/dev/null || true
          fi
          /usr/libexec/PlistBuddy -c 'Print' "$app/Info.plist"
          otool -L "$exe" | grep -i -E "mpv|framework/" | head -20 || true
          rm -f out/WiSTV.ipa
          zip -qry out/WiSTV.ipa Payload
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: WiSTV-ipa
          path: out/WiSTV.ipa
          retention-days: 14

      - name: Publish IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios >/dev/null 2>&1 || gh release create ios --prerelease --title "WiS TV cho iPhone" --notes "Bản dựng mới nhất của WiS TV cho iPhone. Cài bằng Sideloadly, ký lại mỗi 7 ngày."
          gh release upload ios out/WiSTV.ipa --clobber
