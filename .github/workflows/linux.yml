name: Linux app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "plugins/**"
      - "ui/**"
      - ".github/workflows/linux.yml"

permissions:
  contents: write

concurrency:
  group: linux
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system libraries
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2

      - name: Build packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          NO_STRIP: "true"
        run: |
          set -e
          VERSION="0.1.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          printf '{"version":"%s"}' "$VERSION" > "$RUNNER_TEMP/version.json"
          cd src-tauri
          cargo tauri build --config tauri.linux-release.json --config "$RUNNER_TEMP/version.json"

      - name: Collect packages
        run: |
          set -e
          root=src-tauri/target/release/bundle
          ls -la "$root/deb" "$root/appimage"
          mkdir -p out
          cp "$(ls "$root"/deb/*.deb | head -1)" out/WiSTV-linux-amd64.deb
          img=$(ls "$root"/appimage/*.AppImage | head -1)
          cp "$img" out/WiSTV-linux-x86_64.AppImage
          sig=$(cat "$img.sig")
          url="https://github.com/${{ github.repository }}/releases/download/linux/WiSTV-linux-x86_64.AppImage"
          date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{"version":"%s","notes":"","pub_date":"%s","platforms":{"linux-x86_64":{"signature":"%s","url":"%s"}}}\n' "$VERSION" "$date" "$sig" "$url" > out/latest.json
          cat out/latest.json
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: WiSTV-linux
          path: out/

      - name: Publish packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release view linux >/dev/null 2>&1 || gh release create linux --title "WiS TV cho Linux" --notes "Gói cài WiS TV cho Linux."
          for f in out/WiSTV-linux-amd64.deb out/WiSTV-linux-x86_64.AppImage out/latest.json; do
            for i in 1 2 3 4 5; do gh release upload linux "$f" --clobber && break; [ "$i" = 5 ] && exit 1; sleep 20; done
          done

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: "1"
        run: python3 .github/scripts/release_notes.py linux "$VERSION"
