name: UI translations

on:
  push:
    branches: [main]
    paths: ["ui/**", ".github/scripts/i18n_check.mjs", ".github/workflows/i18n.yml"]
  pull_request:
    paths: ["ui/**", ".github/scripts/i18n_check.mjs", ".github/workflows/i18n.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/i18n_check.mjs
