name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["ui/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Version assets
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(href|src)=\"(styles\.css|app\.js)\"#\1=\"\2?v=$v\"#g" ui/index.html
          sed -i "s#from \"./web.js\"#from \"./web.js?v=$v\"#" ui/app.js
          grep -q "app.js?v=$v" ui/index.html
          grep -q "styles.css?v=$v" ui/index.html
          grep -q "web.js?v=$v" ui/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui
      - id: deployment
        uses: actions/deploy-pages@v4
