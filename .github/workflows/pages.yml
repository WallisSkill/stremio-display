name: Deploy download page to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "ui/**", "src-tauri/src/hotui.rs", ".github/scripts/ui_bundle.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_run:
    workflows: ["iOS app", "Windows app", "Android app", "Linux app"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2
      - name: Build the signed interface bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -e
          v=$(git log -1 --format=%ct -- ui .github/scripts/ui_bundle.mjs)
          api=$(sed -E -n 's/^pub const API: u32 = ([0-9]+);$/\1/p' src-tauri/src/hotui.rs)
          test -n "$v" && test -n "$api"
          mkdir -p site/ui
          node .github/scripts/ui_bundle.mjs ui "$v" "$api" site/ui/bundle.json
          cargo tauri signer sign site/ui/bundle.json
          test -s site/ui/bundle.json.sig
          jq -cn --argjson v "$v" --argjson api "$api" '{v: $v, api: $api}' > site/ui/version.json
          cat site/ui/version.json
      - name: Build the Discord Activity
        env:
          DISCORD_CLIENT_ID: "1574131469826134136"
        run: |
          set -e
          mkdir -p site/activity
          cp -R ui/. site/activity/
          sed -i "s#<head>#<head>\n  <meta name=\"wistv-discord-client\" content=\"${DISCORD_CLIENT_ID}\">#" site/activity/index.html
          sdk="$RUNNER_TEMP/discord-sdk"
          mkdir -p "$sdk"
          cd "$sdk"
          npm init -y > /dev/null
          npm install --no-save --no-audit --no-fund @discord/embedded-app-sdk@2.5.0 esbuild@0.28.2
          printf 'export { DiscordSDK, patchUrlMappings } from "@discord/embedded-app-sdk";\n' > entry.js
          npx esbuild entry.js --bundle --format=esm --minify --outfile="$GITHUB_WORKSPACE/site/activity/discord-sdk.js"
          test -s "$GITHUB_WORKSPACE/site/activity/discord-sdk.js"
      - name: Snapshot the app releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          out='{}'
          for tag in ios windows android linux; do
            if ! rel=$(gh api "repos/${{ github.repository }}/releases/tags/$tag" --jq '{body, assets: [.assets[] | {name, size, updated_at, browser_download_url}]}' 2>/dev/null); then rel=null; fi
            out=$(jq -c --arg t "$tag" --argjson r "$rel" '. + {($t): $r}' <<<"$out")
          done
          jq --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '. + {generated: $at}' <<<"$out" > site/releases.json
          jq -c 'with_entries(.value |= (if type == "object" then {assets: (.assets | length)} else . end))' site/releases.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
