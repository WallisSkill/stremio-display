name: Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "plugins/**"
      - "ui/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2

      - name: Create Android project
        run: |
          set -e
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          sed -i 's/crate-type = \["staticlib", "rlib"\]/crate-type = ["staticlib", "cdylib", "rlib"]/' src-tauri/Cargo.toml
          grep -n crate-type src-tauri/Cargo.toml
          cd src-tauri
          cargo tauri android init --ci
          cargo tauri icon icons/icon.png

      - name: Build APK
        run: |
          set -o pipefail
          VERSION="0.1.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          printf '{"version":"%s"}' "$VERSION" > "$RUNNER_TEMP/version.json"
          cd src-tauri
          cargo tauri android build --apk --split-per-abi --target aarch64 --config "$RUNNER_TEMP/version.json" 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Show build errors
        if: failure()
        run: |
          grep -nE "error:|error\[|e: |FAILURE|What went wrong" -A4 "$RUNNER_TEMP/build.log" | head -150 || true

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name "*arm64*release*.apk" | head -1)
          echo "unsigned: $apk"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/wistv.p12"
          mkdir -p out
          "$tools/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/wistv.p12" --ks-type PKCS12 --ks-pass env:KEYSTORE_PASSWORD --out out/WiSTV.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --print-certs out/WiSTV.apk | head -5
          rm -f "$RUNNER_TEMP/wistv.p12"
          unzip -l out/WiSTV.apk | grep -E "lib/|classes" | head -30
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: WiSTV-android
          path: out/WiSTV.apk

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release view android >/dev/null 2>&1 || gh release create android --title "WiS TV cho Android" --notes "Bản cài đặt WiS TV cho Android (arm64)."
          for i in 1 2 3 4 5; do gh release upload android out/WiSTV.apk --clobber && break; [ "$i" = 5 ] && exit 1; sleep 20; done

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: "1"
        run: python3 .github/scripts/release_notes.py android "$VERSION"
