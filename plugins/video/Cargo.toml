[package]
name = "tauri-plugin-wistv-video"
version = "0.1.0"
edition = "2021"
description = "Native video surface, wake lock and link opening for WiS TV on iOS and Android"
links = "tauri-plugin-wistv-video"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
