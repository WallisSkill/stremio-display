[package]
name = "wistv"
version = "0.1.0"
edition = "2021"
description = "WiS TV - a personal Stremio front end"

[lib]
name = "wistv_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "net", "io-util", "sync", "fs", "rt-multi-thread", "macros"] }
futures = "0.3"
urlencoding = "2"
librqbit = { version = "9.1", default-features = false, features = ["rust-tls"] }

[target.'cfg(any(windows, target_os = "android", target_os = "linux"))'.dependencies]
libloading = "0.8"

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-wistv-video = { path = "../plugins/video" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 1

[profile.release]
codegen-units = 4
lto = "thin"
strip = true

[patch.crates-io]
librqbit-dualstack-sockets = { path = "patches/librqbit-dualstack-sockets" }
